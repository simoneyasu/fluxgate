[package]
name = "fluxgate"
version = "0.1.0"
edition = "2021"
rust-version = "1.94"
description = "A concurrency-safe distributed rate limiter backed by DynamoDB"
license = "MIT"

[dependencies]
async-trait = "0.1.92"
aws-config = "1.8.11"
aws-sdk-dynamodb = "1.79.0"
axum = "0.8"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
sha2 = "0.11"
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "time"] }
tower-http = { version = "0.6", features = ["request-id", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

[dev-dependencies]
http-body-util = "0.1"
serde_json = "1"
tower = { version = "0.5", features = ["util"] }

[profile.release]
lto = "thin"
strip = true
